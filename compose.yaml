services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: deng
      POSTGRES_USER: deng
      POSTGRES_PASSWORD: deng_dev_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://deng:deng_dev_password@db:5432/deng
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}

volumes:
  pgdata: